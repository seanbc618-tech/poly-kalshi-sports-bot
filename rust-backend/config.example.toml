# Polytaoli - 预测市场套利程序配置文件
# 这是配置文件模板，请复制为 config.toml 并填入你的实际凭据

# 只监控不下单（true = 不自动下单，所有下单请求直接拒绝）
monitor_only = true

[kalshi]
# Kalshi API Key（从 https://kalshi.com/profile/api 获取）
api_key = "your-kalshi-api-key-here"

# Kalshi API Secret（RSA 私钥）
# 支持 PKCS#1 格式（-----BEGIN RSA PRIVATE KEY-----）
# 或 PKCS#8 格式（-----BEGIN PRIVATE KEY-----）
api_secret = """-----BEGIN RSA PRIVATE KEY-----
YOUR_KALSHI_PRIVATE_KEY_HERE
-----END RSA PRIVATE KEY-----"""

# Kalshi API 基础 URL
base_url = "https://api.elections.kalshi.com/trade-api/v2"

[polymarket]
# Polymarket 配置
# 
# Gamma API 基础 URL（用于获取市场数据）
base_url = "https://gamma-api.polymarket.com"

# Python 下单服务地址（订单通过此服务提交）
# Polymarket 下单由单独的 Python 服务处理，使用官方 py-clob-client SDK
# 私钥和钱包地址等凭据在 Python 服务中配置
order_service_url = "http://127.0.0.1:8001"

# [settings] 和 [auto_trade] 配置已迁移到数据库
# 可在前端界面实时修改，无需重启服务
# 以下为初始默认值（首次启动时写入数据库）

[settings]
# 数据刷新间隔（秒）
refresh_interval = 5
# 显示套利机会的最小利润率（%）
min_profit_margin = 1.0
# 套利计算使用的默认金额（美元）
default_bet_amount = 10.0
# 开始追踪记录的利润率阈值（%）
tracking_threshold = 2.0

[auto_trade]
# 自动下单功能默认关闭
enabled = false
# 自动下单单次最大金额（美元）
max_amount = 10.0
# 自动下单最大执行次数
max_trade_count = 2
# 套利机会持续时间阈值（毫秒）
min_duration_ms = 500

[auth]
# Web UI 登录认证配置
username = "admin"
password = "admin123"

# JWT 密钥（请修改为随机字符串，至少 32 字符）
secret_key = "your-secret-key-change-this-in-production-min-32-chars-long"

# Token 过期时间（小时）
token_expire_hours = 24

[telegram]
# Telegram 通知配置（自动下单通知）
# 默认关闭，需要时启用
enabled = false

# Telegram Bot Token（从 @BotFather 获取）
bot_token = "YOUR_BOT_TOKEN_HERE"

# Telegram Chat ID（群组或频道 ID）
# 获取方式：将 bot 添加到群组后，发送消息，然后访问
# https://api.telegram.org/bot<YOUR_BOT_TOKEN>/getUpdates
chat_id = "YOUR_CHAT_ID_HERE"
